[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.dependencies]
anchor-lang = { version = "=1.0.0-rc.5", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.0-rc.5", features = ["token", "metadata"] }
solana-program = "^3"

