[package]
name = "proposal"
version = "0.1.1"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "proposal"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "vote-hook-interface/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
devnet = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
vote-hook-interface = { path = "../vote_hook_interface", features = ["no-entrypoint", "cpi"] }
